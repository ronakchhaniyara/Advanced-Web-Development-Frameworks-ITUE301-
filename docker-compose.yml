version: "3.8"

services:
  # 1. React Frontend (Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-portfolio-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # 2. Node/Express Backend
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: task-manager-api-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task_manager_db
      - JWT_SECRET=super_secret_jwt_key_wdf_academic_2026
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # 3. MongoDB Database
  mongodb:
    image: mongo:6
    container_name: task-manager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
